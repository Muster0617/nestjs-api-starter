services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        command: ['postgres', '-c', 'max_connections=200']
        ports:
            - '127.0.0.1:5432:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: master123
            POSTGRES_DB: postgres
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - app-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - '127.0.0.1:6379:6379'
        environment:
            REDIS_PASSWORD: master123
        command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --port 6379']
        volumes:
            - redis_data:/data
        networks:
            - app-network
        healthcheck:
            test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

networks:
    app-network:
        driver: bridge

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
