<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            color: #1f2933;
        }
        .wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 32px 16px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 10px;
            border: 1px solid #e4e7eb;
            padding: 32px;
        }
        .title {
            margin: 0 0 8px;
            font-size: 20px;
            font-weight: 600;
        }
        .intro {
            margin: 0 0 24px;
            font-size: 14px;
            line-height: 1.6;
            color: #52606d;
        }
        .code-box {
            background-color: #f4f5f7;
            border: 1px dashed #cbd2d9;
            border-radius: 8px;
            padding: 24px 16px;
            text-align: center;
        }
        .code {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 8px;
            color: #1f2933;
        }
        .valid {
            margin: 16px 0 0;
            font-size: 13px;
            color: #7b8794;
            text-align: center;
        }
        .notice {
            margin: 24px 0 0;
            padding: 12px 16px;
            background-color: #fff8e6;
            border-left: 3px solid #f5a623;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.6;
            color: #5c4813;
        }
        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #9aa5b1;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <h1 class="title">{{title}}</h1>
            <p class="intro">{{intro}}</p>
            <div class="code-box">
                <div class="code">{{code}}</div>
            </div>
            <p class="valid">验证码 {{validMinutes}} 分钟内有效，仅可使用一次。</p>
            <p class="notice">{{notice}}</p>
        </div>
        <div class="footer">&copy; {{year}} 本邮件由系统自动发送，请勿直接回复。</div>
    </div>
</body>
</html>
